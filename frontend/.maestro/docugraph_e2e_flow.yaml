- launchApp:
    clearState: true

# 1. Assert Dashboard & Clean Architecture SSOT Status
- assertVisible: "DocuGraph AI"
- assertVisible: "Đang trực tuyến · Clean Arch SSOT"

# 2. Trigger On-Device ML Kit OCR Scanner Flow
- tapOn: "Thêm tài liệu"
